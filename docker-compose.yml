
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kr2-app:1.0
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      STUDENT: Klimash

    ports:
      - "127.0.0.1:8003:8003"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    env_file:
      - .env

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis_data:

